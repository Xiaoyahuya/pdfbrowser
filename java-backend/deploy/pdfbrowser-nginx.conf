server {
    listen 18880 ssl;
    listen [::]:18880 ssl;
    server_name 110.42.101.86;

    ssl_certificate /etc/nginx/pdfbrowser-tls/server.crt;
    ssl_certificate_key /etc/nginx/pdfbrowser-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    error_page 497 =308 https://$host:18880$request_uri;

    auth_basic "PDF Browser";
    auth_basic_user_file /etc/nginx/pdfbrowser-auth/htpasswd;

    client_max_body_size 100m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/account/password {
        limit_except POST OPTIONS {
            deny all;
        }

        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Authenticated-User $remote_user;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location = /api/files/upload {
        limit_except POST OPTIONS {
            deny all;
        }

        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location ^~ /api/nas/mounts {
        limit_except GET POST DELETE OPTIONS {
            deny all;
        }

        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        limit_except GET HEAD OPTIONS {
            deny all;
        }

        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

services:
  postgres:
    image: postgres:17
    container_name: postgres

    environment:
      POSTGRES_DB: ${PDFBROWSER_DB_NAME:-postgres}
      POSTGRES_USER: ${PDFBROWSER_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PDFBROWSER_DB_PASSWORD:-123456}

    ports:
      - "127.0.0.1:${PDFBROWSER_DB_PORT:-5432}:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
